# Job: models.panel_fit
#
# Self-contained on purpose. This file owns the model's environment, its
# dependency list and its compute — change any of them here without touching
# another model.
#
# Nearly as light as the annealing control case: numpy and the harness's
# transport, nothing else. The work is many small least-squares fits, which
# is CPU-bound and trivially parallel but deliberately kept serial so the
# per-unit progress messages stay ordered.

resources:
  jobs:
    model_panel_fit:
      name: "[${bundle.target}] dbx-leaning · panel_fit"
      description: >-
        Runs models.panel_fit through the job harness. One independent
        curve fit per group over panel data, where individual groups may
        fail without failing the run.

      # The account ceiling is 5 concurrent job TASKS across ALL models
      # combined, which Databricks has no way to express per-job — so the app
      # enforces it globally before triggering (app/server/routes/runs.py) and this
      # only bounds this one model.
      max_concurrent_runs: 1
      timeout_seconds: 1800
      queue:
        enabled: true

      tags:
        project: dbx-leaning
        model: panel_fit

      # Declared so run-now can set them. The trigger endpoint sends exactly
      # these names; tests/deploy/test_bundle.py fails if the two drift.
      parameters:
        - name: DBX_RUN_ID
          default: ""
        - name: DBX_MODEL
          default: job.models.panel_fit
        - name: DBX_MODEL_CONFIG
          default: "{}"
        - name: DBX_CATALOG
          default: ${var.catalog}
        - name: DBX_SCHEMA
          default: ${var.schema}
        - name: DBX_APP_URL
          default: ${var.app_public_url}
        - name: DBX_APP_TOKEN
          default: ""
        # The app's OAuth identity, forwarded by the trigger endpoint at
        # run-now time (app/server/routes/runs.py) rather than defaulted here:
        # the secret belongs in the app's environment, not in eleven job
        # definitions. Declared with an empty default because Databricks
        # rejects a run-now parameter a job has not declared — and a run
        # triggered outside the app simply gets no credentials and runs
        # unobserved, which is a supported state.
        #
        # This is what makes the job authenticate as the SAME principal as the
        # app. Its own runtime identity cannot: `dbutils` hands out a
        # workspace REST API token, which the Apps proxy bounces to a login
        # page and Lakebase refuses as a password. Both want a Databricks
        # OAuth token, and only the OIDC exchange in job/auth.py mints one.
        - name: DBX_OAUTH_CLIENT_ID
          default: ""
        - name: DBX_OAUTH_CLIENT_SECRET
          default: ""
        # Deployment config, not run data: the app never overrides these, so
        # they arrive as defaults. Databricks rejects a run-now parameter a
        # job has NOT declared; declaring one the app does not send is fine.
        - name: DBX_LAKEBASE_DSN
          default: ${var.lakebase_dsn}
        - name: DBX_LAKEBASE_USER
          default: ${var.lakebase_user}
        - name: DBX_LAKEBASE_SCHEMA
          default: ${var.lakebase_schema}
        # Not a secret, and the thing without which no OAuth exchange can
        # happen at all: `job/auth.py` needs somewhere to POST /oidc/v1/token,
        # and with no host it declines that source before looking at whether
        # it has credentials. Lakebase takes the resulting token as its
        # password and the Apps proxy demands it for the WebSocket, so this
        # one line gates both live paths.
        - name: DBX_WORKSPACE_HOST
          default: ${workspace.host}

      environments:
        - environment_key: panel_fit
          spec:
            client: "3"
            # Exported from uv.lock — what deploys is what the tests ran
            # against. Regenerate with scripts/export_requirements.py.
            dependencies:
              - -r ${workspace.file_path}/deploy/requirements/panel_fit.txt

      tasks:
        - task_key: run
          environment_key: panel_fit
          spark_python_task:
            python_file: ${workspace.file_path}/job/run_model.py
            source: WORKSPACE
            # Serverless tasks have no spark_env_vars, so parameters travel as
            # KEY=VALUE arguments and the entrypoint exports them.
            parameters:
              - DBX_RUN_ID={{job.parameters.DBX_RUN_ID}}
              - DBX_MODEL={{job.parameters.DBX_MODEL}}
              - DBX_MODEL_CONFIG={{job.parameters.DBX_MODEL_CONFIG}}
              - DBX_CATALOG={{job.parameters.DBX_CATALOG}}
              - DBX_SCHEMA={{job.parameters.DBX_SCHEMA}}
              - DBX_APP_URL={{job.parameters.DBX_APP_URL}}
              - DBX_APP_TOKEN={{job.parameters.DBX_APP_TOKEN}}
              - DBX_OAUTH_CLIENT_ID={{job.parameters.DBX_OAUTH_CLIENT_ID}}
              - DBX_OAUTH_CLIENT_SECRET={{job.parameters.DBX_OAUTH_CLIENT_SECRET}}
              - DBX_LAKEBASE_DSN={{job.parameters.DBX_LAKEBASE_DSN}}
              - DBX_LAKEBASE_USER={{job.parameters.DBX_LAKEBASE_USER}}
              - DBX_LAKEBASE_SCHEMA={{job.parameters.DBX_LAKEBASE_SCHEMA}}
              - DBX_WORKSPACE_HOST={{job.parameters.DBX_WORKSPACE_HOST}}
