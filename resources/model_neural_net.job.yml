# Job: models.neural_net
#
# Self-contained on purpose. This file owns the model's environment, its
# dependency list and its compute — change any of them here without touching
# another model.
#
# The heavy one, and the reason per-model environments exist: torch and its
# CUDA stack make this environment ~43 packages against the annealing job's
# 13. Only this job carries it — tests/deploy/test_requirements.py asserts
# torch reaches exactly one environment.
#
# This is also where GPU compute would be requested if the model ever needs
# it: the environment spec below changes, and no other model's file does.
# The model already reports its torch device in telemetry, so a CPU run and a
# GPU run are distinguishable after the fact.

resources:
  jobs:
    model_neural_net:
      name: "[${bundle.target}] dbx-leaning · neural_net"
      description: >-
        Runs models.neural_net through the job harness. Simulated neural_net
        over a knapsack — standard library only, no third-party solver.

      # The account ceiling is 5 concurrent job TASKS across ALL models
      # combined, which Databricks has no way to express per-job — so the app
      # enforces it globally before triggering (app/server/routes/runs.py) and this
      # only bounds this one model.
      max_concurrent_runs: 1
      timeout_seconds: 3600
      queue:
        enabled: true

      tags:
        project: dbx-leaning
        model: neural_net

      # Declared so run-now can set them. The trigger endpoint sends exactly
      # these names; tests/deploy/test_bundle.py fails if the two drift.
      parameters:
        - name: DBX_RUN_ID
          default: ""
        - name: DBX_MODEL
          default: job.models.neural_net
        - name: DBX_MODEL_CONFIG
          default: "{}"
        - name: DBX_CATALOG
          default: ${var.catalog}
        - name: DBX_SCHEMA
          default: ${var.schema}
        - name: DBX_APP_URL
          default: ${var.app_public_url}
        - name: DBX_APP_TOKEN
          default: ""

      environments:
        - environment_key: neural_net
          spec:
            client: "3"
            # Exported from uv.lock — what deploys is what the tests ran
            # against. Regenerate with scripts/export_requirements.py.
            dependencies:
              - -r ${workspace.file_path}/deploy/requirements/neural_net.txt

      tasks:
        - task_key: run
          environment_key: neural_net
          spark_python_task:
            python_file: ${workspace.file_path}/entrypoints/run_model.py
            source: WORKSPACE
            # Serverless tasks have no spark_env_vars, so parameters travel as
            # KEY=VALUE arguments and the entrypoint exports them.
            parameters:
              - DBX_RUN_ID={{job.parameters.DBX_RUN_ID}}
              - DBX_MODEL={{job.parameters.DBX_MODEL}}
              - DBX_MODEL_CONFIG={{job.parameters.DBX_MODEL_CONFIG}}
              - DBX_CATALOG={{job.parameters.DBX_CATALOG}}
              - DBX_SCHEMA={{job.parameters.DBX_SCHEMA}}
              - DBX_APP_URL={{job.parameters.DBX_APP_URL}}
              - DBX_APP_TOKEN={{job.parameters.DBX_APP_TOKEN}}
