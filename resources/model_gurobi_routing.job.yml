# Job: models.gurobi_routing
#
# Self-contained on purpose. This file owns the model's environment, its
# dependency list and its compute — change any of them here without touching
# another model.
#
# Shares the `gurobi` extra with job/models/gurobi_scheduling — deliberate reuse,
# and the case that proves the per-model split does not force one extra per
# model. Two jobs, one dependency set, separate environments.
#
# Its lazy rounded-capacity cuts do NOT count against the restricted licence's
# 2000-constraint cap: Gurobi holds them in the lazy pool, so a default solve
# separates ~412 cuts while NumConstrs stays at 25. That is what makes a
# routing model viable here at all — see docs/free-edition-constraints.md.

resources:
  jobs:
    model_gurobi_routing:
      name: "[${bundle.target}] dbx-leaning · gurobi_routing"
      description: >-
        Runs models.gurobi_routing through the job harness. Simulated gurobi_routing
        over a knapsack — standard library only, no third-party solver.

      # The account ceiling is 5 concurrent job TASKS across ALL models
      # combined, which Databricks has no way to express per-job — so the app
      # enforces it globally before triggering (app/server/routes/runs.py) and this
      # only bounds this one model.
      max_concurrent_runs: 1
      timeout_seconds: 7200
      queue:
        enabled: true

      tags:
        project: dbx-leaning
        model: gurobi_routing

      # Declared so run-now can set them. The trigger endpoint sends exactly
      # these names; tests/deploy/test_bundle.py fails if the two drift.
      parameters:
        - name: DBX_RUN_ID
          default: ""
        - name: DBX_MODEL
          default: job.models.gurobi_routing
        - name: DBX_MODEL_CONFIG
          default: "{}"
        - name: DBX_CATALOG
          default: ${var.catalog}
        - name: DBX_SCHEMA
          default: ${var.schema}
        - name: DBX_APP_URL
          default: ${var.app_public_url}
        - name: DBX_APP_TOKEN
          default: ""

      environments:
        - environment_key: gurobi_routing
          spec:
            client: "3"
            # Exported from uv.lock — what deploys is what the tests ran
            # against. Regenerate with scripts/export_requirements.py.
            dependencies:
              - -r ${workspace.file_path}/deploy/requirements/gurobi_routing.txt

      tasks:
        - task_key: run
          environment_key: gurobi_routing
          spark_python_task:
            python_file: ${workspace.file_path}/job/run_model.py
            source: WORKSPACE
            # Serverless tasks have no spark_env_vars, so parameters travel as
            # KEY=VALUE arguments and the entrypoint exports them.
            parameters:
              - DBX_RUN_ID={{job.parameters.DBX_RUN_ID}}
              - DBX_MODEL={{job.parameters.DBX_MODEL}}
              - DBX_MODEL_CONFIG={{job.parameters.DBX_MODEL_CONFIG}}
              - DBX_CATALOG={{job.parameters.DBX_CATALOG}}
              - DBX_SCHEMA={{job.parameters.DBX_SCHEMA}}
              - DBX_APP_URL={{job.parameters.DBX_APP_URL}}
              - DBX_APP_TOKEN={{job.parameters.DBX_APP_TOKEN}}
