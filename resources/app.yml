# The Databricks App: the optional observer.
#
# It is not a model and gets none of their libraries — no Delta writer, no
# gurobipy, no scikit-learn. Its requirements.txt lives at the repo root
# because that is where Databricks Apps looks, and it too is exported from
# uv.lock.
#
# The app's config is declared here rather than in a committed app.yaml so
# that DBX_JOB_IDS can be built from the real job ids the bundle creates —
# they do not exist until deploy, and hand-maintaining them would go stale
# the first time a job is recreated.

resources:
  apps:
    dbx_leaning:
      name: dbx-leaning
      description: >-
        Triggers and observes long-running models. Jobs run whether or not
        this is up; when it is, it relays their telemetry live over SSE.

      # `app/` is the whole app and nothing else — the shape the Databricks
      # app template uses, one level down so the repo can also hold the jobs:
      #
      #   app/server/        the FastAPI package (their server/)
      #   app/client/        the React source (their client/) — never deployed
      #   app/dist/          the built SPA, committed, served by server/spa.py
      #   app/shared/        a TRACKED copy of the repo root's shared/, because
      #                      this folder deploys alone and server/ imports it
      #   app/requirements.txt   where Databricks Apps looks for it
      #
      # `scripts/sync_shared.py` makes that copy and
      # `tests/deploy/test_shared_copy.py` fails the moment it drifts.
      #
      # What the export cannot survive is a SYMLINK:
      #
      #   Failed to export .../DBX_leaning/.venv/bin/python
      #   INVALID_PARAMETER_VALUE: ... is not an exportable asset. type=symlink
      #
      # Which is why the copy is a copy. `app/client/node_modules` carries
      # symlinked bin shims whatever installs it, and the export fails on the
      # first symlink it meets — so it is excluded from the sync in
      # `databricks.yml`, along with `.venv`.
      #
      # A sync exclude does not remove what an EARLIER deploy already put
      # there. If a previous run uploaded `.venv`, delete it in the workspace
      # once — deploy/README.md has the command.
      source_code_path: ../app

      # The token a job presents on the WS/HTTP ingress. Held as a secret and
      # injected here; the *job* never stores it — the app passes it per run
      # as a job parameter at trigger time (app/server/routes/runs.py).
      # `scope` here is a WORKSPACE secret scope — a flat namespace with no
      # catalog and no schema. It is not Unity Catalog, and a secret created
      # in UC (which appears in the catalog tree under `main.dbx_leaning`)
      # cannot be read from here. The names differing by one character is the
      # trap: `dbx-leaning` the scope, `dbx_leaning` the schema.
      #
      # Wrong store fails the DEPLOY, not the app:
      #   Invalid secret resource app-token: Secret with scope dbx-leaning
      #   and key app-token does not exist. (404 NOT_FOUND)
      resources:
        - name: app-token
          description: Shared secret authenticating a job's ingress connection.
          secret:
            scope: ${var.app_secret_scope}
            key: app-token
            permission: READ

        # The app's durable filesystem — `uc_ddl/003_app_volume.sql`.
        #
        # A Databricks App's own disk is not storage: the app runs up to 24
        # hours and then stops, taking its container with it, and a redeploy
        # does the same. A file written beside the code is downloadable until
        # the next restart, which is worse than not offering it at all.
        #
        # READ and WRITE are DECLARED SEPARATELY because Unity Catalog treats
        # them as separate privileges — `WRITE VOLUME` does not imply
        # `READ VOLUME`, and `permission` here takes one value.
        # OPTIONAL — running as a service principal you granted yourself,
        # rather than the one Databricks Apps creates for this app.
        #
        # COMMENTED OUT ON PURPOSE, and it is not a style choice. A declared
        # secret resource is VALIDATED AT DEPLOY TIME, so if the key is not in
        # the scope the whole deploy fails before uploading anything:
        #
        #   Error: cannot update resources.apps.dbx_leaning:
        #   Invalid secret resource oauth-client-secret: Secret with scope
        #   dbx-leaning and key oauth-client-secret does not exist. (404)
        #
        # There is no "leave it unset and it falls back" for a declared
        # resource — declaring it makes it required. Everything else optional
        # in this platform degrades at RUN time and says so on `/healthz`;
        # this one cannot, so it is off until you opt in.
        #
        # To use a principal of your own, create the secret first, then
        # uncomment BOTH this block and the DBX_OAUTH_CLIENT_SECRET env below,
        # and set the `oauth_client_id` variable to its application id:
        #
        #   databricks secrets put-secret ${var.app_secret_scope} \
        #     oauth-client-secret --string-value "<the SP's OAuth secret>"
        #
        # - name: oauth-client-secret
        #   description: Secret for the service principal the app runs as.
        #   secret:
        #     scope: ${var.app_secret_scope}
        #     key: oauth-client-secret
        #     permission: READ

        - name: app-store-read
          description: Read the app's own volume.
          uc_securable:
            securable_type: VOLUME
            securable_full_name: ${var.catalog}.${var.schema}.${var.app_volume}
            permission: READ_VOLUME
        - name: app-store-write
          description: Write to the app's own volume.
          uc_securable:
            securable_type: VOLUME
            securable_full_name: ${var.catalog}.${var.schema}.${var.app_volume}
            permission: WRITE_VOLUME

        # --- the jobs this app triggers --------------------------------
        #
        # DBX_JOB_IDS below tells the app WHICH job runs which model. It does
        # not give it the right to run one. Without these, `POST /api/runs`
        # reaches Databricks and is refused:
        #
        #   run-now failed for job 123: HTTP 403 {"error_code":
        #   "PERMISSION_DENIED", "message": "User ... does not have Manage Run
        #   or Owner permissions on job 123"}
        #
        # which the trigger route surfaces verbatim. The two have to be
        # declared together, and `tests/deploy/test_bundle.py` fails if a
        # model is in one and not the other.
        #
        # WHO THIS GRANTS TO: the service principal Databricks Apps created
        # for this app — NOT the `oauth_client_id` principal. An app resource
        # can only grant to the app's own identity. If you point the app at a
        # principal of your own, that one needs the grant separately; see
        # "Running as your own service principal" in deploy/README.md.
        #
        # CAN_MANAGE_RUN, not CAN_MANAGE: enough to start and cancel a run,
        # not to edit the job definition. The bundle owns the definition.
        #
        # Unlike the secret resource above, declaring these cannot 404 the
        # deploy — this same bundle creates the jobs, so the ids always
        # resolve to something that exists.
        - name: job-gurobi-scheduling
          description: Trigger the gurobi_scheduling model.
          job:
            id: ${resources.jobs.model_gurobi_scheduling.id}
            permission: CAN_MANAGE_RUN
        - name: job-gurobi-routing
          description: Trigger the gurobi_routing model.
          job:
            id: ${resources.jobs.model_gurobi_routing.id}
            permission: CAN_MANAGE_RUN
        - name: job-scenario
          description: Trigger the scenario model.
          job:
            id: ${resources.jobs.model_scenario.id}
            permission: CAN_MANAGE_RUN
        - name: job-forecasting
          description: Trigger the forecasting model.
          job:
            id: ${resources.jobs.model_forecasting.id}
            permission: CAN_MANAGE_RUN
        - name: job-mcmc
          description: Trigger the mcmc model.
          job:
            id: ${resources.jobs.model_mcmc.id}
            permission: CAN_MANAGE_RUN
        - name: job-bayesian-ab
          description: Trigger the bayesian_ab model.
          job:
            id: ${resources.jobs.model_bayesian_ab.id}
            permission: CAN_MANAGE_RUN
        - name: job-annealing
          description: Trigger the annealing model.
          job:
            id: ${resources.jobs.model_annealing.id}
            permission: CAN_MANAGE_RUN
        - name: job-neural-net
          description: Trigger the neural_net model.
          job:
            id: ${resources.jobs.model_neural_net.id}
            permission: CAN_MANAGE_RUN
        - name: job-ortools-jobshop
          description: Trigger the ortools_jobshop model.
          job:
            id: ${resources.jobs.model_ortools_jobshop.id}
            permission: CAN_MANAGE_RUN
        - name: job-panel-fit
          description: Trigger the panel_fit model.
          job:
            id: ${resources.jobs.model_panel_fit.id}
            permission: CAN_MANAGE_RUN

        # The warehouse the read path uses — backfill, history and startup
        # reconciliation. Nothing WRITES through it (see docs/architecture.md);
        # telemetry goes to Delta from the job. CAN_USE is run-queries-on,
        # not administer.
        #
        # This one is validated at deploy time like any resource, so a
        # `warehouse_id` naming a warehouse that does not exist fails the
        # deploy rather than 403-ing at run time. That is the better end of
        # the trade, but it does mean the id has to be right before deploying.
        - name: sql-warehouse
          description: Read path — backfill, history and reconciliation.
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE

        # --- Lakebase, when you have an instance ------------------------
        #
        # COMMENTED OUT for the same reason the SP secret above is: a declared
        # resource is validated at DEPLOY time, so naming an instance that
        # does not exist fails the whole deploy before anything is uploaded.
        # `lakebase_host` defaults to empty, and an empty deployment is a
        # supported (degraded) one.
        #
        # Uncomment once the instance exists, and set `instance_name` to the
        # instance's NAME — not the `read_write_dns` hostname `lakebase_host`
        # takes.
        #
        # CAN_CONNECT_AND_CREATE is the only permission this resource offers,
        # and CREATE is the half that matters: `ensure_schema()` issues
        # `CREATE SCHEMA IF NOT EXISTS dbx_leaning`, and Postgres grants CREATE
        # on a database to its owner alone.
        #
        # - name: lakebase
        #   description: Run state — the run_status table.
        #   database:
        #     instance_name: dbx-leaning
        #     database_name: ${var.lakebase_database}
        #     permission: CAN_CONNECT_AND_CREATE

      config:
        # Mirrors `app/app.yaml`, which is what the runtime reads when the
        # app is deployed any way OTHER than by this bundle — the Apps UI, or
        # `databricks apps deploy --source-code-path ...`. Neither file can
        # see the other, so `tests/deploy/test_app_yaml.py` asserts they
        # agree; a command that differs between the two ways of deploying is
        # the kind of thing that is only ever discovered in production.
        command:
          - uvicorn
          - server.main:app
          - --host
          - 0.0.0.0
          - --port
          # NOT a hardcoded 8000. Databricks Apps assigns the port; binding
          # anything else means its health check never connects and the
          # deployment is marked failed with the process running fine.
          - $DATABRICKS_APP_PORT
        env:
          # The built SPA. `app/client/` is the SOURCE and never deploys;
          # `app/client/vite.config.ts` writes `../dist`, so the output lands
          # at the app root beside `server/`. `server/config.py` already
          # defaults to this — set explicitly because a deploy should not rest
          # on a Python default matching a build config written in TypeScript.
          - name: DBX_FRONTEND_DIST
            value: dist

          # Where the app may write files. Empty is a supported, degraded
          # deploy: `/healthz` reports it and anything that would write a file
          # answers 503, because nothing on the RUN path touches this — the
          # job writes telemetry to Delta and results to their own tables.
          - name: DBX_APP_VOLUME
            value: /Volumes/${var.catalog}/${var.schema}/${var.app_volume}

          - name: DBX_CATALOG
            value: ${var.catalog}
          - name: DBX_SCHEMA
            value: ${var.schema}
          - name: DBX_WAREHOUSE_ID
            value: ${var.warehouse_id}

          # --- Lakebase: where run_status lives --------------------------
          #
          # `app/server/config.py::_lakebase_dsn` builds the connection string from
          # these. An empty host means none is configured and the app falls
          # back to the warehouse-backed run store — a supported deploy, but a
          # degraded one: that store's `release_slot` is a no-op relying on
          # reconciliation, so the 5-task ceiling becomes advisory rather than
          # transactional, and every check costs warehouse uptime. `/healthz`
          # reports which store is live, and `services.py` logs it at startup.
          #
          # The CREDENTIAL is the piece that needs verifying on a real
          # workspace. Lakebase authenticates with a short-lived Databricks
          # OAuth token — which is why `app/server/store.py` opens a connection per
          # operation instead of pooling, so rotation is a non-issue. No
          # `DBX_LAKEBASE_PASSWORD` is set here, so `_lakebase_dsn` falls back
          # to `DATABRICKS_TOKEN`. If that turns out not to be present in the
          # Apps runtime, add the credential as a secret rather than a
          # variable — a variable would land in the deployment state:
          #
          #   - name: DBX_LAKEBASE_PASSWORD
          #     value_from: lakebase-password
          #
          # with a matching entry under `resources:` above, alongside
          # `app-token`.
          - name: DBX_LAKEBASE_HOST
            value: ${var.lakebase_host}
          - name: DBX_LAKEBASE_DATABASE
            value: ${var.lakebase_database}
          - name: DBX_LAKEBASE_PORT
            value: ${var.lakebase_port}
          - name: DBX_LAKEBASE_USER
            value: ${var.lakebase_user}
          # Not `public` — see the variable's description in databricks.yml.
          - name: DBX_LAKEBASE_SCHEMA
            value: ${var.lakebase_schema}

          # --- who the app authenticates as ------------------------------
          #
          # One service principal for all three: the Postgres password (an
          # OAuth token — Lakebase takes nothing else unless
          # `enable_pg_native_login` was turned on), the Statement Execution
          # API, and the Jobs API. `server/oauth.py` exchanges these at
          # `/oidc/v1/token` and caches the result until just before it
          # expires, per `server/services.py::_token_source`.
          #
          # Empty is supported: the app then uses the service principal
          # Databricks Apps injects for it, and failing that a static
          # DATABRICKS_TOKEN. Naming one here is for when the app should run
          # as a principal you granted explicitly — which is also what
          # `lakebase_user` above should be set to.
          # The id alone does nothing — `has_client_credentials` needs both —
          # and setting it without uncommenting the secret below is reported
          # on `/healthz` rather than silently ignored.
          - name: DBX_OAUTH_CLIENT_ID
            value: ${var.oauth_client_id}
          # - name: DBX_OAUTH_CLIENT_SECRET
          #   value_from: oauth-client-secret

          # Which job runs which model. This map is also the app's allow-list:
          # a model with no job here cannot be triggered, so the app never
          # imports job/models/ just to validate a request.
          - name: DBX_JOB_IDS
            value: >-
              {"gurobi_scheduling": ${resources.jobs.model_gurobi_scheduling.id},
               "gurobi_routing": ${resources.jobs.model_gurobi_routing.id},
               "scenario": ${resources.jobs.model_scenario.id},
               "forecasting": ${resources.jobs.model_forecasting.id},
               "mcmc": ${resources.jobs.model_mcmc.id},
               "bayesian_ab": ${resources.jobs.model_bayesian_ab.id},
               "annealing": ${resources.jobs.model_annealing.id},
               "neural_net": ${resources.jobs.model_neural_net.id},
               "ortools_jobshop": ${resources.jobs.model_ortools_jobshop.id},
               "panel_fit": ${resources.jobs.model_panel_fit.id}}

          # Where a job should attach. Empty until the app has a URL — jobs
          # then run unobserved, which is a normal state, not a failure.
          - name: DBX_APP_PUBLIC_URL
            value: ${var.app_public_url}

          # `value_from`, snake_case. BOTH SPELLINGS ARE REAL, in different
          # files, which is why this keeps getting flipped:
          #
          #   app.yaml         (what the Apps runtime reads)  ->  valueFrom
          #   resources/*.yml  (what the bundle declares)     ->  value_from
          #
          # This is a bundle file. `databricks bundle schema` defines only
          # `value_from` under `resources.apps.*.config.env`, and the CLI
          # translates it into `valueFrom` in the app.yaml it generates. CLI
          # v1.13.0 says so out loud rather than failing:
          #
          #   Warning: Use 'value_from' instead of 'valueFrom'
          #   The field 'valueFrom' should be 'value_from' (snake_case).
          #   The 'valueFrom' field will be ignored.
          #
          # "Ignored" is the whole problem. An ignored token means the app
          # starts with DBX_APP_TOKEN empty, and per
          # `app/server/routes/ingest.py::_authorised` an empty token is the
          # development posture that accepts EVERYONE — an open job ingress.
          # A warning is cheap to scroll past; the failure is silent.
          #
          # `tests/deploy/test_bundle.py` asserts the spelling.
          - name: DBX_APP_TOKEN
            value_from: app-token
