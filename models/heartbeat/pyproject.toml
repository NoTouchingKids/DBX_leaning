# The heartbeat, as its own distribution.
#
# One model, one package, one dependency list. A model that later needs torch
# says so here and nowhere else — which is what the per-model dependency extras
# in v3 were reaching for, without a central registry that has to agree with
# eleven other files.
#
# It declares an ENTRY POINT rather than being found by path. That is what
# retires `[tool.dbx-leaning.models]`, `scripts/_registry.py` and the dotted
# module path in DBX_MODEL: the harness asks importlib.metadata what models are
# installed, so a model in another repo is discovered identically to this one.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbx-model-heartbeat"
version = "0.1.0"
description = "A tick a second. The model the transport is proven with."
requires-python = ">=3.11"

# Deliberately empty, and `modelkit` is NOT missing from it.
#
# The template this model subclasses is a SHARED SERVERLESS ENVIRONMENT
# DEPENDENCY — installed once into the environment, not once per model. See
# modelkit/pyproject.toml and the Databricks doc it cites. Declaring it here
# would be wrong twice: it says nothing pip can resolve (the kit is not on an
# index), and it misstates where the thing comes from.
#
# This is the same rule pyspark already follows in this repo: the environment
# provides it, so no model declares it.
dependencies = []

[project.entry-points."dbx_leaning.models"]
# The CLASS, not a factory function. `modelkit.Model.__init__` already takes
# both a config dict and keywords, so there is nothing left for a factory to
# do. `build_model` still exists in the module for anyone who prefers it.
heartbeat = "heartbeat:Heartbeat"

[tool.setuptools]
packages = ["heartbeat"]
