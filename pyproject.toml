[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbx-leaning"
version = "0.1.0"
description = "Modelling application platform on Databricks Free Edition"
requires-python = ">=3.11"

# Core = what shared/ needs, and nothing else. shared/ is imported by both
# app/ and job/, so anything added here is paid for by every deployment
# artefact. Keep it to the envelope's own needs.
dependencies = [
    "pydantic>=2.7,<3",
    "msgpack>=1.0,<2",
]

[project.optional-dependencies]
# --- transport tracks -------------------------------------------------
# No databricks-sdk on either side: both the Statement Execution API and the
# Jobs API are reached over plain REST with httpx, which CLAUDE.md allows and
# which keeps every model environment that much smaller.
app = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
]
job = [
    "websockets>=12",
    "httpx>=0.27",
]
# INVERTED since this was written, and this comment was the last place in the
# repo still asserting the old design. Spark is THE write path, not a
# fallback: it needs no pin because a session already exists on Databricks
# serverless. delta-rs is unimplemented and `job/delta.py::DeltaRsWriter`
# raises `NotImplementedError` rather than doing what it used to — handed a
# three-part Unity Catalog name it wrote to a LOCAL DIRECTORY without
# erroring, so a run reported SUCCEEDED with its telemetry in a container
# about to be discarded. `select_writer("auto")` never picks it.
#
# The extra is kept for the day it is built (it needs credential vending
# first, see job/delta.py). Nothing installs it today:
# `scripts/export_requirements.py` excludes it from every model environment,
# and `scripts/build_model_wheel.py` excludes it unless asked.
delta = [
    "deltalake>=0.18",
    "pyarrow>=15",
]

# --- model tracks -----------------------------------------------------
# gurobipy: the bundled restricted licence has a FIXED EXPIRY PER RELEASE
# and fails hard, not gracefully, once past it (docs/free-edition-constraints.md).
#
#   PINNED:  gurobipy 13.x
#   BUNDLED LICENCE EXPIRY:  2027-11-29  (verified 2026-08-22 against 13.0.2)
#
# Re-verify whenever this pin moves:  python scripts/check_gurobi_licence.py
gurobi = ["gurobipy>=13,<14"]
# OR-Tools CP-SAT: the open-source counterweight to the Gurobi models.
# Constraint programming rather than branch-and-bound, and — the point —
# NO variable or constraint cap, where the bundled Gurobi licence stops at
# 2000/2000. A problem that outgrows gurobi_scheduling has somewhere to go.
# Apache-2.0, CPU-only, no licence file and no token endpoint to reach.
ortools = ["ortools>=9.14,<10"]
forecasting = ["numpy>=1.26", "scikit-learn>=1.4"]
mcmc = ["numpy>=1.26", "emcee>=3.1"]
# Least squares on a country x year panel. numpy and nothing else — no
# scikit-learn, no scipy: `polyfit` and `lstsq` are the whole toolkit, and a
# per-country fit of a few dozen points does not need more.
panel = ["numpy>=1.26"]
# Conjugate arithmetic: math.lgamma for the incomplete beta, numpy for one
# grid convolution. Its own extra rather than sharing mcmc's, which would
# ship emcee to a job that never imports it — the same unused weight the
# delta extra was pulled from the job environments for. The "third copy of
# the numpy pin" this avoids is not a real risk: uv.lock pins numpy once for
# the whole workspace, and tests/deploy asserts no version drift between
# environments.
bayesian = ["numpy>=1.26"]
# The heavy one, deliberately. This is the model whose dependency actually
# justifies per-model environments: torch must not reach the four models that
# do not want it. If the split works, only this job carries it.
nn = ["torch>=2.4", "numpy>=1.26"]
scenario = ["numpy>=1.26"]
# Rolling-origin backtest: numpy's lstsq, deliberately nothing heavier.
# The platform value here is the chunked result path, not the modelling.
streaming = ["numpy>=1.26"]
# Deliberately empty, and that is the whole point of job/models/annealing: it is
# the control case proving the microservice split really can produce a
# minimal environment. Its job deploys with the harness's own transport and
# nothing else. An empty list is valid PEP 621 and uv/setuptools accept it —
# verified, not assumed. If anything ever needs adding here, the model has
# lost its reason to exist and should be reconsidered rather than grown.
annealing = []
# Convenience for developing against every model at once. It deliberately
# EXCLUDES `nn`: torch and its CUDA stack are ~4GB, and dragging that into
# `pip install dbx-leaning[models]` would defeat the per-model split for
# everyone who just wanted the light ones. Install [nn] explicitly.
# tests/deploy/test_requirements.py enforces this rather than trusting it.
models = [
    "dbx-leaning[gurobi,forecasting,mcmc,bayesian,scenario,streaming,annealing,ortools,panel]",
]

[dependency-groups]
# PEP 735 group, not an extra: `uv sync` installs these by default for
# development, and nothing that installs the package can pull them in.
dev = [
    "jsonschema>=4.26.0",
    # Embedded Postgres for tests/app/test_run_store.py, and the one dependency
    # here that does not exist everywhere: it publishes wheels for linux x86_64,
    # macOS, and Windows amd64, and none for aarch64 Linux. Unmarked, `uv sync`
    # is unsatisfiable on an ARM Linux box — which includes a Databricks
    # machine, so a deploy driven from inside the workspace failed on a test
    # dependency it had no reason to install:
    #
    #   × No solution found when resolving dependencies:
    #   ╰─▶ Because pgserver==0.1.4 has no wheels with a matching platform tag
    #       (e.g., `manylinux_2_39_aarch64`)
    #
    # The marker makes it absent rather than fatal there. The test already
    # `pytest.importorskip`s it, so the suite reports a skip and everything
    # else runs.
    "pgserver>=0.1.4; (sys_platform == 'linux' and platform_machine == 'x86_64') or sys_platform == 'darwin' or (sys_platform == 'win32' and platform_machine == 'AMD64')",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pyyaml>=6.0.3",
    "ruff>=0.4",
    "ty>=0.0.1a1",
]

[tool.uv]
# One resolution covering every extra, so the lockfile describes a single
# consistent world rather than one per install shape. The job installs a
# subset of it (--extra job --extra gurobi), never a different resolution.
default-groups = ["dev"]

# One place naming every model and the extra that carries its libraries.
# Both scripts/export_requirements.py and scripts/build_model_wheel.py read
# this, because they were each keeping their own copy of the same fact — and
# a model registered in one but not the other deploys with the wrong
# dependencies rather than failing.
#
# Directory names and extra names do not all match, which is exactly why this
# is explicit rather than inferred.
[tool.dbx-leaning.models]
gurobi_scheduling = "gurobi"
# Same extra as the scheduling model, deliberately: one gurobipy pin, one
# bundled-licence expiry date, two jobs.
gurobi_routing = "gurobi"
scenario = "scenario"
forecasting = "forecasting"
mcmc = "mcmc"
bayesian_ab = "bayesian"
# The heavy one: torch, and only this job carries it.
neural_net = "nn"
streaming_results = "streaming"
# Maps to an intentionally empty extra — see the note above it.
annealing = "annealing"
# The open-source scheduler. Same problem domain as gurobi_scheduling, a
# different solver paradigm and no size cap.
ortools_jobshop = "ortools"
# Many small independent fits over panel data, with per-unit outcomes.
panel_fit = "panel"

[tool.setuptools]
packages = ["shared", "server", "job"]
# Each deployable unit is a folder that carries everything it needs:
# `server/` lives inside `app/`, and `job/models/` lives inside `job/`. See the
# layout note in CLAUDE.md.
package-dir = { server = "app/server" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The repo root FIRST, then the app folder. Order is load-bearing: `app/`
# carries a tracked copy of `shared/` (it is deployed on its own and must be
# self-contained), and with `app` ahead of `.` every test would import the
# COPY. Root first means `shared` is always the canonical one and the copy is
# only ever what the deployed app uses — which is also what
# `tests/deploy/test_shared_copy.py` is there to keep true.
pythonpath = [".", "app"]
filterwarnings = ["error::DeprecationWarning:shared.*"]
markers = [
    "requires_gurobi: needs gurobipy installed (bundled restricted licence)",
    "requires_sklearn: needs scikit-learn installed",
    "requires_emcee: needs emcee installed",
    "slow: takes more than a couple of seconds",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ty.src]
# Source only. The test suite is excluded deliberately, not because it is
# exempt from care: its fixtures splat dicts into dataclasses, inject
# duck-typed stubs, and call attributes the harness wires at runtime — every
# one of which a static checker objects to and none of which is a defect.
# Contorting them to satisfy the checker would cost readability and buy
# nothing. Scoped this way, `uv run ty check` is a signal that sits at zero.
# `app/server`, not `app` — `app/client` is TypeScript and `app/shared` is a
# generated copy of `shared`, which would be checked twice and reported twice.
include = ["app/server", "job", "shared", "scripts"]

[tool.ty.rules]
# ty is pre-1.0, so it runs advisory (`uv run ty check`) rather than as a CI
# gate — treating a young checker's opinion as a build failure buys churn,
# not safety. Revisit when it stabilises.
#
# pyspark is deliberately absent from the dependency set: on Databricks
# serverless the runtime provides it, and the SparkWriter imports it lazily
# for exactly that reason (docs/free-edition-constraints.md).
unresolved-import = "warn"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# `class X(str, Enum)` rather than StrEnum, deliberately: the envelope's enums
# are serialised by Pydantic, msgpack and JSON, and the explicit str mixin is
# the form every one of those handles identically across versions.
ignore = ["UP042"]

[tool.ruff.lint.isort]
# `server` lives at `app/server`, not at the repo root, so ruff's automatic
# first-party detection misses it and sorts it in with third-party imports.
# Everything here is ours; say so rather than let the import blocks churn.
known-first-party = ["server", "shared", "job", "scripts"]
