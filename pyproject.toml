[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbx-leaning"
version = "0.1.0"
description = "Modelling application platform on Databricks Free Edition"
requires-python = ">=3.11"

# Core = what shared/ needs, and nothing else. shared/ is imported by both
# app/ and job/, so anything added here is paid for by every deployment
# artefact. Keep it to the envelope's own needs.
dependencies = [
    "pydantic>=2.7,<3",
    "msgpack>=1.0,<2",
]

[project.optional-dependencies]
# --- transport tracks -------------------------------------------------
app = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "databricks-sdk>=0.30",
]
job = [
    "websockets>=12",
    "httpx>=0.27",
    "databricks-sdk>=0.30",
]
# delta-rs is the *preferred* write_batch implementation; Spark is the
# fallback and needs no pin — on Databricks serverless a session already
# exists (docs/free-edition-constraints.md).
delta = [
    "deltalake>=0.18",
    "pyarrow>=15",
]

# --- model tracks -----------------------------------------------------
# gurobipy: the bundled restricted licence has a FIXED EXPIRY PER RELEASE
# and fails hard, not gracefully, once past it (docs/free-edition-constraints.md).
#
#   PINNED:  gurobipy 12.x
#   BUNDLED LICENCE EXPIRY:  UNVERIFIED — see models/gurobi_scheduling/LICENCE_EXPIRY.md
#
# Verify before this track is built for real:  python scripts/check_gurobi_licence.py
gurobi = ["gurobipy>=12,<13"]
forecasting = ["numpy>=1.26", "scikit-learn>=1.4"]
mcmc = ["numpy>=1.26", "emcee>=3.1"]
scenario = ["numpy>=1.26"]
streaming = ["numpy>=1.26", "scikit-learn>=1.4"]
models = [
    "dbx-leaning[gurobi,forecasting,mcmc,scenario,streaming]",
]

dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.setuptools]
packages = ["shared", "app", "job", "models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:shared.*"]
markers = [
    "requires_gurobi: needs gurobipy installed (bundled restricted licence)",
    "requires_sklearn: needs scikit-learn installed",
    "requires_emcee: needs emcee installed",
    "slow: takes more than a couple of seconds",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
