[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbx-leaning"
version = "0.1.0"
description = "Modelling application platform on Databricks Free Edition"
requires-python = ">=3.11"

# Core = what shared/ needs, and nothing else. shared/ is imported by both
# app/ and job/, so anything added here is paid for by every deployment
# artefact. Keep it to the envelope's own needs.
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
# Two extras, because there are two deployable units and no models yet.
#
# The per-model extras that used to be here — gurobi, forecasting, mcmc,
# bayesian, nn, scenario, streaming, annealing, ortools, panel, and the
# `models` aggregate — are on `dev` with the models they scoped. That split was
# the good part of v3's packaging and it comes back with them; it simply has
# nothing to scope right now.
#
# The SDK note that used to sit here has changed, and v4 reverses half of it:
# `databricks-sdk` is adopted for TOKEN ACQUISITION AND REFRESH, because
# hand-rolling that cost 343 lines and two deploy bugs. The Jobs API stays
# plain httpx — a few REST calls do not justify the weight in every model
# environment. See docs/v4-rewrite-plan.md, "Auth: the SDK, for credentials
# only". Neither is wired up yet.
app = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
]
job = [
    "websockets>=12",
    "httpx>=0.27",
    "databricks-sdk>=0.30",
]

[dependency-groups]
# PEP 735 group, not an extra: `uv sync` installs these by default for
# development, and nothing that installs the package can pull them in.
dev = [
    # The one model this branch has, installed editable so the suite can drive
    # it. It is a DEV dependency and must stay one: the platform does not
    # depend on any particular model — the harness finds whatever is installed
    # by entry point — and, concretely, the job environment installs this
    # repo's root with pip, which cannot resolve `dbx-model-heartbeat` from
    # PyPI. Only `[tool.uv.sources]` below knows where it lives, and only uv
    # reads that. A model in `[project.dependencies]` fails the deploy.
    "dbx-model-heartbeat",
    "jsonschema>=4.26.0",
    # Embedded Postgres for tests/app/test_run_store.py, and the one dependency
    # here that does not exist everywhere: it publishes wheels for linux x86_64,
    # macOS, and Windows amd64, and none for aarch64 Linux. Unmarked, `uv sync`
    # is unsatisfiable on an ARM Linux box — which includes a Databricks
    # machine, so a deploy driven from inside the workspace failed on a test
    # dependency it had no reason to install:
    #
    #   × No solution found when resolving dependencies:
    #   ╰─▶ Because pgserver==0.1.4 has no wheels with a matching platform tag
    #       (e.g., `manylinux_2_39_aarch64`)
    #
    # The marker makes it absent rather than fatal there. The test already
    # `pytest.importorskip`s it, so the suite reports a skip and everything
    # else runs.
    "pgserver>=0.1.4; (sys_platform == 'linux' and platform_machine == 'x86_64') or sys_platform == 'darwin' or (sys_platform == 'win32' and platform_machine == 'AMD64')",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pyyaml>=6.0.3",
    "ruff>=0.4",
    "ty>=0.0.1a1",
]

[tool.uv.workspace]
# Every model is its own distribution, and this is what makes `uv sync` install
# them all editable in one go. A model added under `models/` is picked up by
# the glob; nothing central lists them, which is the point — the harness finds
# them by entry point, not by a registry that has to be kept in agreement.
members = ["models/*"]

[tool.uv.sources]
dbx-model-heartbeat = { workspace = true, editable = true }

[tool.uv]
# One resolution covering every extra, so the lockfile describes a single
# consistent world rather than one per install shape. The job installs a
# subset of it (--extra job --extra gurobi), never a different resolution.
default-groups = ["dev"]

# One place naming every model and the extra that carries its libraries.
# Both scripts/export_requirements.py and scripts/build_model_wheel.py read
# this, because they were each keeping their own copy of the same fact — and
# a model registered in one but not the other deploys with the wrong
# dependencies rather than failing.
#
# Directory names and extra names do not all match, which is exactly why this
# is explicit rather than inferred.
# `[tool.dbx-leaning.models]` — the model name -> dependency extra map — is
# gone with the models. It was read through `scripts/_registry.py` by the
# requirements exporter and the wheel builder, and it existed because those two
# had each kept their own copy and could disagree. Restore all three together
# or none: a registry with one reader is just a dict in the wrong file.

[tool.setuptools]
# Subpackages are listed, not globbed: `package-dir` maps two of these out of
# `app/`, and setuptools' `find` directive does not see through that cleanly.
# `server.routes` missing here was silent — nothing outside `app/` imports it —
# but the metadata said the distribution carried `server` when it carried half.
packages = ["shared", "server", "server.routes", "job"]
# `models` is absent on purpose: each model is its own distribution under
# `models/`, installed as a uv workspace member, and this package must not
# carry any of them. See models/heartbeat/pyproject.toml.
#
# `server` AND `shared` are mapped out of `app/` because that folder is the
# deployed app and nothing above it travels with it. `shared` living there is
# the part that looks wrong and is not: Databricks Apps is handed `app/` as
# its `source_code_path`, so the envelope has to be INSIDE it or the app
# cannot import what it parses. Putting the canonical copy there and mapping
# it back is what lets the job have the same module without a second copy —
# the job installs this distribution and setuptools puts `shared` on its path
# like any other package.
#
# The alternative, and what v3 did, was a tracked copy at `app/shared/` plus a
# sync script plus a test that failed when they drifted. One directory in a
# slightly odd place is the cheaper half of that trade.
package-dir = { server = "app/server", shared = "app/shared" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The repo root for `job`; `app/` for `server` and `shared`, which is exactly
# where the deployed app finds them. There is no longer a second copy for the
# order to matter against — the copies, the sync script and the drift test all
# went when the units started installing packages instead of syncing files.
pythonpath = [".", "app"]
filterwarnings = ["error::DeprecationWarning:shared.*"]
markers = [
    "requires_gurobi: needs gurobipy installed (bundled restricted licence)",
    "requires_sklearn: needs scikit-learn installed",
    "requires_emcee: needs emcee installed",
    "slow: takes more than a couple of seconds",
    "container: builds and runs real Docker images (needs DBX_CONTAINER_TESTS=1)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ty.environment]
# `app/` is a source root, not just a folder: `server` and `shared` both live
# under it (see the package-dir note above), which is exactly what
# `[tool.pytest.ini_options] pythonpath` says and what the deployed app sees.
# Without this, every `from shared.x import ...` reads as unresolved.
extra-paths = ["app"]

[tool.ty.src]
# Source only. The test suite is excluded deliberately, not because it is
# exempt from care: its fixtures splat dicts into dataclasses, inject
# duck-typed stubs, and call attributes the harness wires at runtime — every
# one of which a static checker objects to and none of which is a defect.
# Contorting them to satisfy the checker would cost readability and buy
# nothing. Scoped this way, `uv run ty check` is a signal that sits at zero.
# `app/server`, not `app` — `app/client` is TypeScript and `app/dist` is the
# built bundle. `models/` is out too: a model is an independent distribution
# and is checked in its own right, not as part of the platform.
include = ["app/server", "app/shared", "job", "scripts"]

[tool.ty.rules]
# ty is pre-1.0, so it runs advisory (`uv run ty check`) rather than as a CI
# gate — treating a young checker's opinion as a build failure buys churn,
# not safety. Revisit when it stabilises.
#
# pyspark is deliberately absent from the dependency set: on Databricks
# serverless the runtime provides it, and the SparkWriter imports it lazily
# for exactly that reason (docs/free-edition-constraints.md).
unresolved-import = "warn"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# `class X(str, Enum)` rather than StrEnum, deliberately: the envelope's enums
# are serialised by Pydantic and JSON, and the explicit str mixin is
# the form every one of those handles identically across versions.
ignore = ["UP042"]

[tool.ruff.lint.isort]
# `server` lives at `app/server`, not at the repo root, so ruff's automatic
# first-party detection misses it and sorts it in with third-party imports.
# Everything here is ours; say so rather than let the import blocks churn.
known-first-party = ["server", "shared", "job", "scripts"]
