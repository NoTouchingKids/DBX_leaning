# Databricks Asset Bundle for DBX_leaning.
#
# Shape: **one job per model**, each with its own serverless environment and
# its own dependency list. A model is a microservice — the MCMC job does not
# carry gurobipy, and a model that later needs GPU compute changes its own
# file and nothing else. That is why the job definitions live one-per-file
# under resources/ and repeat a little YAML rather than sharing an anchor:
# the duplication is what lets them diverge.
#
# Code reaches the workspace by **file sync**, not as a wheel. Each job runs
# job/run_model.py from the synced tree. When that changes to a wheel
# later, the task definition changes and nothing else does.

bundle:
  name: dbx-leaning

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog holding the platform's tables.
    default: main
  schema:
    description: Schema within that catalog.
    default: dbx_leaning
  warehouse_id:
    description: >-
      SQL warehouse for the app's READ path only (backfill, reconciliation).
      Free Edition allows one, 2X-Small. Nothing writes through it.

      This was "7474655945367403" until 2026-08-26, which is the WORKSPACE
      number that also appears in app_public_url — not a warehouse id at all.
      It had never been exercised: the app reports `sql` degraded and keeps
      streaming when the read path is unavailable, so a wrong id here looks
      exactly like no id at all.
    default: "e4a96cfb1f5b262b"
  app_volume:
    description: >-
      Unity Catalog volume giving the app a durable filesystem — exports,
      uploads, cached artefacts. An App's own disk is not storage: it stops
      after at most 24h and a redeploy replaces the container. Created by
      uc_ddl/003_app_volume.sql.
    default: app_store
  oauth_client_id:
    description: >-
      Application id of the service principal the app authenticates as —
      against Postgres, Unity Catalog and the Jobs API alike. An id, not a
      credential; the matching secret is a SECRET (`oauth-client-secret` in
      the scope below), never a variable. Empty falls back to the service
      principal Databricks Apps injects for the app itself.
    default: ""
  app_secret_scope:
    description: Secret scope holding the token a job presents to the app.
    default: dbx-leaning
  app_public_url:
    description: >-
      The app's externally reachable URL, handed to each job so it knows where
      to attach. Empty is valid and normal — the run proceeds unobserved and
      stays fully durable. Fill this in after the first deploy, once the app
      has a URL.
    default: "https://dbx-leaning-7474655945367403.aws.databricksapps.com"

  # --- Lakebase (managed Postgres): where run_status lives ---------------
  #
  # `run_status` is the one OLTP-shaped thing in this platform — one row per
  # run, point-looked-up, updated on every transition, and counted against
  # the 5-concurrent-task ceiling. Postgres gives it what Delta structurally
  # cannot: a primary key on run_id, and a transaction around the
  # count-and-claim so that ceiling is enforced rather than merely observed
  # (app/server/store.py, `pg_advisory_xact_lock`).
  #
  # Leaving `lakebase_host` empty is a SUPPORTED but DEGRADED deploy: the app
  # falls back to WarehouseRunStore, whose `release_slot` is a no-op that
  # relies on reconciliation to correct it. Everything still works; the
  # ceiling becomes advisory and each check costs warehouse uptime. Prefer
  # Lakebase. /healthz says which one is live.
  lakebase_host:
    description: >-
      Lakebase instance hostname, e.g.
      instance-name.database.cloud.databricks.com. Empty falls back to the
      warehouse-backed run store — see the note above.
    default: ""
  lakebase_database:
    description: Database within the Lakebase instance.
    default: databricks_postgres
  lakebase_port:
    description: Lakebase port. TLS is required and assumed.
    default: "5432"
  lakebase_schema:
    description: >-
      Postgres schema `run_status` lives in.

      NOT `public`: since PostgreSQL 15 that schema grants no CREATE to
      PUBLIC, so a service principal that does not own the database gets
      `permission denied for schema public` the first time the app applies
      its DDL, and /healthz reports `lakebase` degraded for a reason nobody
      expects. The app creates this schema itself at startup
      (lakebase_ddl/001_run_status.sql is the same DDL, reviewable).
    default: dbx_leaning
  # There is deliberately NO lakebase_password variable, and there never will
  # be one. An instance created with `enable_pg_native_login: false` — the
  # default, and what this deployment has — accepts only a short-lived
  # Databricks OAuth token as its password. `app/server/oauth.py` fetches one
  # per connection. A static credential could not work here even if a variable
  # were the right place for it, which it is not: variables land in the
  # deployment state.
  lakebase_user:
    description: >-
      Postgres role the app connects as.

      When `oauth_client_id` is set this MUST be the same application id.
      Lakebase authenticates with an OAuth token and the role Databricks
      provisions is named after the principal that token belongs to, so
      connecting as one principal while presenting another's token fails as
      an ordinary authentication error — which reads as a bad password and
      sends you looking at the secret. `tests/deploy/test_bundle.py` refuses
      the mismatch, and `/healthz` reports it at run time.

      Empty falls back to the warehouse-backed run store.
    default: ""

# The workspace sync is what puts the tree in the workspace;
# `resources/app.yml` then hands Databricks Apps the `app/` subfolder of it,
# and each job task runs `job/run_model.py` out of the same tree.
#
# Two of these excludes are not tidiness. The App export rejects symlinks and
# fails on the FIRST one it meets, so the count is beside the point: `.venv/bin`
# is full of them, and `app/client/node_modules` carries bin shims whatever
# installs it — 22 under bun, thousands under pnpm's symlink-per-package store.
# Either directory reaching the workspace fails the whole deploy.
#
# `app/client/**` goes wholesale: the React source has no business in a
# workspace with no Node runtime, and the build output is not in that
# directory anyway — `vite.config.ts` writes `../dist`, i.e. `app/dist`, which
# is committed and syncs like any other tracked file.
# Runs before the bundle is loaded, on `validate` and `deploy` alike.
#
# `job/` is a self-contained deployable unit and carries its own copy of
# `shared/` — but that copy is gitignored, because a job is only ever deployed
# from here and this is the hook that makes it. One canonical `shared/` in the
# repo; a complete `job/` in the workspace.
#
# `preinit` and not the top-level `scripts:` block: in CLI v1.13.0 only
# `experimental.scripts` actually fires. Verified against a scratch bundle
# rather than assumed, because a hook that silently does not run would deploy
# a `job/` with no `shared/` in it and fail at import time in the workspace.
#
# `python3`, NOT `uv run` — and this is the one line in the repo where the
# project's own "use uv" rule is deliberately not followed.
#
# `uv run` resolves and syncs the project environment before it runs anything,
# and `[tool.uv] default-groups = ["dev"]` puts the dev group in that
# resolution. A deploy driven from INSIDE Databricks runs on aarch64, where
# `pgserver` — an embedded Postgres for one test file — publishes no wheel:
#
#   × No solution found when resolving dependencies:
#   ╰─▶ Because pgserver==0.1.4 has no wheels with a matching platform tag
#       (e.g., `manylinux_2_39_aarch64`) ... your requirements are unsatisfiable
#
# So the deploy died on a test dependency it had no reason to install. The
# script is stdlib-only (argparse, filecmp, pathlib, shutil, sys) precisely so
# the hook can run on whatever interpreter is already there and install
# nothing. `tests/deploy/test_shared_copy.py` holds both halves of that.
experimental:
  scripts:
    preinit: python3 scripts/sync_shared.py

sync:
  exclude:
    - .venv/**
    - .git/**
    - "**/__pycache__/**"
    - "**/.pytest_cache/**"
    - .ruff_cache/**
    - .delta-local/**
    - app/client/**
    - tests/**

targets:
  dev:
    mode: development
    default: true

  prod:
    mode: production
    # `mode: production` requires an explicit run_as; jobs and the app run as
    # the deploying principal unless this says otherwise.
    permissions:
      - level: CAN_MANAGE
        service_principal_name: ${workspace.current_user.userName}
