# Databricks Asset Bundle for DBX_leaning.
#
# Shape: **one job per model**, each with its own serverless environment and
# its own dependency list. A model is a microservice — the MCMC job does not
# carry gurobipy, and a model that later needs GPU compute changes its own
# file and nothing else. That is why the job definitions live one-per-file
# under resources/ and repeat a little YAML rather than sharing an anchor:
# the duplication is what lets them diverge.
#
# Code reaches the workspace by **file sync**, not as a wheel. Each job runs
# entrypoints/run_model.py from the synced tree. When that changes to a wheel
# later, the task definition changes and nothing else does.

bundle:
  name: dbx-leaning

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog holding the platform's tables.
    default: main
  schema:
    description: Schema within that catalog.
    default: dbx_leaning
  warehouse_id:
    description: >-
      SQL warehouse for the app's READ path only (backfill, reconciliation).
      Free Edition allows one, 2X-Small. Nothing writes through it.
    default: ""
  app_secret_scope:
    description: Secret scope holding the token a job presents to the app.
    default: dbx-leaning
  app_public_url:
    description: >-
      The app's externally reachable URL, handed to each job so it knows where
      to attach. Empty is valid and normal — the run proceeds unobserved and
      stays fully durable. Fill this in after the first deploy, once the app
      has a URL.
    default: ""

  # --- Lakebase (managed Postgres): where run_status lives ---------------
  #
  # `run_status` is the one OLTP-shaped thing in this platform — one row per
  # run, point-looked-up, updated on every transition, and counted against
  # the 5-concurrent-task ceiling. Postgres gives it what Delta structurally
  # cannot: a primary key on run_id, and a transaction around the
  # count-and-claim so that ceiling is enforced rather than merely observed
  # (app/store.py, `pg_advisory_xact_lock`).
  #
  # Leaving `lakebase_host` empty is a SUPPORTED but DEGRADED deploy: the app
  # falls back to WarehouseRunStore, whose `release_slot` is a no-op that
  # relies on reconciliation to correct it. Everything still works; the
  # ceiling becomes advisory and each check costs warehouse uptime. Prefer
  # Lakebase. /healthz says which one is live.
  lakebase_host:
    description: >-
      Lakebase instance hostname, e.g.
      instance-name.database.cloud.databricks.com. Empty falls back to the
      warehouse-backed run store — see the note above.
    default: ""
  lakebase_database:
    description: Database within the Lakebase instance.
    default: databricks_postgres
  lakebase_port:
    description: Lakebase port. TLS is required and assumed.
    default: "5432"
  lakebase_user:
    description: >-
      Postgres role the app connects as. Usually the app's service principal
      id, which is what Databricks provisions the Lakebase role for.
    default: ""

# The workspace sync is the deployment mechanism, so what it excludes matters.
#
# The frontend is the awkward one. Its SOURCE has no business in the
# workspace — there is no Node runtime there, nothing would ever build it, and
# node_modules alone would dwarf everything else. But its BUILD OUTPUT is what
# `app/spa.py` serves, so the app answers 503 on every page without it. Hence
# the split below: the source subdirectories are excluded, and `frontend/dist`
# is named in `include`, which is what overrides .gitignore — dist is a build
# artifact and is correctly ignored by git.
#
# The excludes below name frontend subdirectories one by one rather than
# excluding `frontend/**` and re-including `frontend/dist/**`. That would be
# shorter, but it depends on whether include or exclude wins when the two
# contradict, which is not something this repo can verify without a live
# workspace. No rule here contradicts another, so precedence does not matter.
#
# `pnpm build` is therefore a REQUIRED step before `databricks bundle deploy`,
# not an optional one — see deploy/README.md. A deploy that skips it produces
# a working API and a site that answers 503 on every page.
sync:
  include:
    - frontend/dist/**
  exclude:
    - .venv/**
    - .git/**
    - "**/__pycache__/**"
    - "**/.pytest_cache/**"
    - .ruff_cache/**
    - .delta-local/**
    - frontend/node_modules/**
    - frontend/src/**
    - frontend/public/**
    - frontend/coverage/**
    - tests/**

targets:
  dev:
    mode: development
    default: true

  prod:
    mode: production
    # `mode: production` requires an explicit run_as; jobs and the app run as
    # the deploying principal unless this says otherwise.
    permissions:
      - level: CAN_MANAGE
        service_principal_name: ${workspace.current_user.userName}
